<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Бібліотека{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4 px-3 rounded">
        <a class="navbar-brand" href="{% url 'home' %}">📚 Книжковий Каталог</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'home' %}">Головна</a>
            <a class="nav-link" href="{% url 'add_book' %}">Додати книгу</a>
        </div>
    </nav>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="mt-5 pt-3 border-top text-muted">
        <p>&copy; {% now "Y" %} — Лабораторна робота Django</p>
    </footer>
</body>
</html>
